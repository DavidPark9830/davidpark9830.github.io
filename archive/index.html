<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="Personal archive of study resources and working documents.">
  <title>Archive | Gyeongmin Park</title>
  <link rel="stylesheet" href="assets/archive.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./" aria-label="Archive home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="5" x="2" y="3" rx="1"></rect><path d="M4 8v13h16V8"></path><path d="M10 12h4"></path></svg>
        <span>Archive</span>
      </a>
      <a class="home-link" href="../">Gyeongmin Park</a>
    </div>
  </header>

  <main class="page-shell">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <span>Archive</span>
    </nav>

    <div class="page-heading">
      <div>
        <h1>Archive</h1>
        <p>Study resources and working documents</p>
      </div>
      <label class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="search" placeholder="Search archive" aria-label="Search archive" data-archive-search>
      </label>
    </div>

    <section class="browser" aria-label="Archive folders">
      <div class="browser-head" aria-hidden="true"><span>Name</span><span>Contents</span><span>Updated</span><span></span></div>
      <article class="archive-item" data-archive-item>
        <div class="item-name">
          <span class="item-icon folder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h6l2 2h10v11H3z"></path></svg></span>
          <div class="item-copy"><a href="phd_prep/">PhD Preparation</a><small>미국 박사과정 지원 준비 자료</small></div>
        </div>
        <span class="item-type">Program research and GRE</span>
        <time class="item-date" datetime="2026-09">Sep 2026</time>
        <a class="open-icon" href="phd_prep/" aria-label="Open PhD Preparation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
      </article>
      <p class="empty-state" data-empty-state hidden>No matching items</p>
    </section>
    <p class="archive-summary" data-visible-count></p>
  </main>

  <script src="assets/archive.js"></script>
</body>
</html>
