    const cards = document.getElementById('cards');
    const visibleCount = document.getElementById('visibleCount');
    const resourceSearch = document.getElementById('resourceSearch');
    const fieldFilter = document.getElementById('fieldFilter');
    const resetFilters = document.getElementById('resetFilters');
    const emptyResults = document.getElementById('emptyResults');

    function escapeHTML(value) {
      return String(value).replace(/[&<>\"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[character]));
    }

    function visibleResources() {
      const query = resourceSearch.value.trim().toLocaleLowerCase('ko-KR');
      return resources.filter(resource => {
        if (fieldFilter.value !== 'all' && resource.field !== fieldFilter.value) return false;
        if (!query) return true;
        const haystack = [resource.name, resource.school, resource.status, resource.year, resource.source, resource.note, resource.caution, ...(resource.tags || [])].join(' ').toLocaleLowerCase('ko-KR');
        return haystack.includes(query);
      });
    }

    function render() {
      const visible = visibleResources();
      cards.innerHTML = visible.map(r => {
        const status = r.status || `${r.tags[0]} · ${r.source === 'CS-SOP' ? '진학' : '지원서 공개'}`;
        const tags = [...new Set([r.priority === 'high' ? '우선 읽기' : '확장 참고', r.source, ...(r.tags || [])])];
        return `
        <article class="card" data-id="${r.id}">
          <div class="card-top"><div><h3>${escapeHTML(r.name)}</h3><p class="school">${escapeHTML(r.school)} · ${escapeHTML(status)}${r.year ? ` · ${escapeHTML(r.year)}` : ''}</p></div></div>
          <div class="tags">${tags.map((tag, index) => `<span class="tag ${index === 0 && r.priority === 'high'?'high':''} ${index === 1?'direct':''}">${escapeHTML(tag)}</span>`).join('')}</div>
          <p class="resource-note">${escapeHTML(r.note)}</p>
          <p class="resource-caution"><strong>적용 메모</strong> · ${escapeHTML(r.caution)}</p>
          <div class="links"><a href="${escapeHTML(r.statement)}" target="_blank" rel="noopener">${escapeHTML(r.statementLabel || 'SOP 원문')} ↗</a>${r.profile ? `<a href="${escapeHTML(r.profile)}" target="_blank" rel="noopener">${escapeHTML(r.profileLabel || '프로필')} ↗</a>` : ''}</div>
        </article>`;
      }).join('');
      visibleCount.textContent = visible.length;
      emptyResults.hidden = visible.length > 0;
    }
    resourceSearch.addEventListener('input', render);
    fieldFilter.addEventListener('change', render);
    resetFilters.addEventListener('click', () => {
      resourceSearch.value = '';
      fieldFilter.value = 'all';
      render();
      resourceSearch.focus();
    });
    render();
  </script>
</body>
