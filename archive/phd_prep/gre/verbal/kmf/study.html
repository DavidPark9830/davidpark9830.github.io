<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="KMF GRE Verbal practice organized by question type.">
  <title>KMF Verbal Study</title>
  <link rel="stylesheet" href="study.css?v=3">
</head>
<body>
  <div class="study-app">
    <header class="study-header">
      <a class="library-link" href="./" aria-label="KMF Verbal 자료 목록으로 이동">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        <span>KMF Library</span>
      </a>
      <div class="title-block">
        <span>KMF Verbal</span>
        <strong id="typeTitle">Study</strong>
      </div>
      <button class="answer-toggle" id="answerToggle" type="button" aria-pressed="false">
        <span id="answerToggleLabel">정답·어휘 보기</span>
      </button>
    </header>

    <main>
      <section class="study-controls" aria-label="학습 범위 설정">
        <label id="levelControl">
          <span>Difficulty</span>
          <select id="levelSelect"></select>
        </label>
        <label>
          <span>Set</span>
          <select id="groupSelect"></select>
        </label>
        <label class="jump-control">
          <span>Question</span>
          <input id="questionJump" type="number" min="1" inputmode="numeric">
          <button id="jumpButton" type="button">Go</button>
        </label>
        <div class="control-actions">
          <button id="randomButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg>
            Random
          </button>
          <div class="zoom-controls" aria-label="이미지 확대 및 축소">
            <button id="zoomOut" type="button" aria-label="축소">−</button>
            <button id="zoomReset" type="button">Fit</button>
            <button id="zoomIn" type="button" aria-label="확대">+</button>
          </div>
        </div>
      </section>

      <section class="progress-row" aria-label="학습 진행률">
        <div class="progress-track"><span id="progressBar"></span></div>
        <span id="progressText">0 completed</span>
      </section>

      <article class="question-frame">
        <header class="question-heading">
          <div>
            <span id="questionCounter">Question 1</span>
            <strong id="questionLabel"></strong>
            <small id="questionMeta"></small>
          </div>
          <div class="question-heading-actions">
            <div class="view-switch" aria-label="문제 표시 방식">
              <button class="active" id="textViewButton" type="button" aria-pressed="true">텍스트</button>
              <button id="imageViewButton" type="button" aria-pressed="false">원본</button>
            </div>
            <label class="complete-control">
              <input id="completeCheckbox" type="checkbox">
              <span>학습 완료</span>
            </label>
          </div>
        </header>

        <section class="question-text-view" id="questionTextView" aria-label="OCR 문제 텍스트">
          <div class="ocr-content" id="questionTextContent"></div>
        </section>

        <div class="image-scroll" id="questionScroll" hidden>
          <div class="image-status" id="questionLoading">문제 이미지를 불러오는 중...</div>
          <img class="study-image" id="questionImage" alt="KMF verbal practice question">
        </div>

        <section class="answer-panel" id="answerPanel" hidden>
          <header>
            <div>
              <strong>Answer & Vocabulary</strong>
              <span>정답과 선택지 어휘의 한글 뜻</span>
            </div>
            <button id="closeAnswer" type="button">닫기</button>
          </header>

          <div class="answer-summary" id="answerSummary">
            <div class="answer-result">
              <span>정답</span>
              <strong id="answerValue">-</strong>
              <small id="answerConfidence"></small>
            </div>
            <section class="vocabulary-section" id="vocabularySection">
              <h3>선택지 어휘</h3>
              <div class="vocabulary-list" id="vocabularyList"></div>
            </section>
            <p class="answer-missing" id="answerMissing" hidden></p>
            <p class="dictionary-credit">한글 뜻은 개인 GRE 단어장과 <a href="https://github.com/jhseo1211/open-english-korean-dict" target="_blank" rel="noreferrer">Open English-Korean Dictionary</a>를 참고했습니다.</p>
            <button class="original-answer-toggle" id="originalAnswerToggle" type="button">원본 해설 이미지 보기</button>
          </div>

          <div class="image-scroll answer-scroll" id="answerScroll" hidden>
            <div class="image-status" id="answerLoading">해설 이미지를 불러오는 중...</div>
            <img class="study-image" id="answerImage" alt="KMF answer, explanation, and vocabulary">
          </div>
        </section>
      </article>
    </main>

    <footer class="study-footer">
      <button id="previousButton" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        Previous
      </button>
      <a href="./">All Types</a>
      <button class="next-button" id="nextButton" type="button">
        Next
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
    </footer>
  </div>

  <script src="study-data.js?v=3"></script>
  <script src="study-text-data.js?v=1"></script>
  <script src="study.js?v=4"></script>
</body>
</html>
