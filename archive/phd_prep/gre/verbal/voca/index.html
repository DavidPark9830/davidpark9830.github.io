<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#f5f6f8">
  <title>GRE Vocabulary</title>
  <link rel="stylesheet" href="styles.css?v=13">
</head>
<body>
  <main class="app-shell">
    <div class="top-stack">
      <header class="topbar">
        <div>
          <p class="eyebrow">GRE · VERBAL REASONING</p>
          <h1>Vocabulary</h1>
        </div>
        <div class="header-actions">
          <button class="text-button" id="shuffleButton" type="button" aria-label="남은 단어 섞기">섞기</button>
          <button class="text-button muted" id="resetButton" type="button" aria-label="학습 기록 초기화">처음부터</button>
        </div>
      </header>

      <section class="voice-loader" id="voiceLoader" role="status" aria-live="polite">
        <div class="voice-loader-copy">
          <span class="voice-loader-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"></path></svg>
          </span>
          <span class="voice-loader-text">
            <strong id="voiceStatusTitle">음성 모델 준비 중</strong>
            <small id="voiceStatusDetail">고품질 영어 음성을 연결하고 있어요.</small>
          </span>
          <span class="voice-loader-percent" id="voiceProgressText">연결 중</span>
        </div>
        <div class="voice-loader-track" aria-hidden="true">
          <div class="voice-loader-fill" id="voiceProgressFill"></div>
        </div>
      </section>

      <section class="progress-panel" aria-label="학습 진행 상황">
        <div class="progress-copy">
          <span id="progressLabel">단어를 준비하고 있어요</span>
          <span id="progressCount">0 / 0</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="stats">
          <div><strong id="knownCount">0</strong><span>아는 단어</span></div>
          <div><strong id="unknownCount">0</strong><span>다시 볼 단어</span></div>
          <div><strong id="remainingCount">0</strong><span>남은 단어</span></div>
        </div>
      </section>
    </div>

    <section class="study-area" aria-live="polite">
      <div class="swipe-label unknown-label" aria-hidden="true">모름</div>
      <div class="swipe-label known-label" aria-hidden="true">알아요</div>

      <div class="card-wrap" id="cardWrap">
        <article class="card" id="card" tabindex="0" role="button" aria-keyshortcuts="Space" aria-label="단어 카드. 눌러서 뜻 보기">
          <div class="card-inner">
            <div class="card-face card-front">
              <span class="card-kicker">WORD</span>
              <h2 id="wordText">Loading…</h2>
              <p class="tap-hint">눌러서 뜻 보기</p>
            </div>
            <div class="card-face card-back">
              <span class="card-kicker" id="dayText">MEANING</span>
              <p class="meaning" id="meaningText">단어 데이터를 불러오고 있습니다.</p>
              <div class="meaning-note" id="meaningNote" hidden>
                <span class="meaning-note-title">단어 구성</span>
                <p id="noteText"></p>
              </div>
              <p class="tap-hint">눌러서 단어 보기</p>
            </div>
          </div>
        </article>
        <button class="pronounce-button" id="pronounceButton" type="button" aria-keyshortcuts="S" aria-label="현재 단어 발음 듣기" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"></path></svg>
          <span id="pronounceText">발음</span><kbd>S</kbd>
        </button>
      </div>

      <div class="complete-panel" id="completePanel" hidden>
        <span class="complete-icon">✓</span>
        <h2>이번 학습을 마쳤어요</h2>
        <p>모든 단어를 한 번 이상 “알아요”로 분류했습니다.</p>
        <button class="primary-button" id="restartButton" type="button">다시 섞어서 시작</button>
      </div>
    </section>

    <section class="controls" aria-label="단어 분류">
      <button class="choice-button unknown" id="unknownButton" type="button" aria-keyshortcuts="ArrowLeft">
        <span class="key">←</span>
        <span><strong>모름</strong><small>중간중간 다시 나와요</small></span>
      </button>
      <button class="choice-button known" id="knownButton" type="button" aria-keyshortcuts="ArrowRight">
        <span><strong>알아요</strong><small>이번 학습에서 제외</small></span>
        <span class="key">→</span>
      </button>
    </section>

  </main>

  <button class="help-button" id="helpButton" type="button" aria-label="도움말 열기" title="도움말">?</button>
  <dialog class="help-dialog" id="helpDialog" aria-labelledby="helpTitle">
    <div class="help-dialog-header">
      <h2 id="helpTitle">키보드 단축키</h2>
      <button class="dialog-close" id="helpCloseButton" type="button" aria-label="도움말 닫기">×</button>
    </div>
    <div class="shortcut-list">
      <div><kbd>Space</kbd><span>단어와 뜻 전환</span></div>
      <div><kbd>←</kbd><span>모르는 단어</span></div>
      <div><kbd>→</kbd><span>아는 단어</span></div>
      <div><kbd>S</kbd><span>발음 듣기</span></div>
    </div>
  </dialog>

  <audio id="pronunciationAudio" preload="auto" playsinline></audio>
  <script src="words.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
