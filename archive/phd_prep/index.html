function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function cls(s){return String(s).replaceAll("·","").replaceAll(" ","")}
function link(u,label){return u?'<a href="'+esc(u)+'" target="_blank" rel="noreferrer">'+label+'</a>':""}
function addScoreFilter(){const section=document.createElement("section");section.className="filtergroup scoregroup";section.innerHTML='<h2>내 TOEFL 신척도 점수 <span class="small">(1–6)</span></h2><div class="scoreinputs">'+[["total","총점"],["reading","Reading"],["listening","Listening"],["speaking","Speaking"],["writing","Writing"]].map(([key,label])=>'<label><span>'+label+'</span><input id="score-'+key+'" class="scoreinput" data-score="'+key+'" type="number" min="1" max="6" step="0.5" inputmode="decimal" placeholder="예: 4.5" aria-label="TOEFL 신척도 '+label+' 점수"></label>').join("")+'</div><span id="toeflSummary" class="small scorehint">입력한 항목의 공식 입학 최소에 명백히 미달하는 학교만 제외합니다. 권장점수와 TA 기준은 제외 조건이 아닙니다.</span>';filters.appendChild(section)}
for(const [key,label] of groups){const values=[...new Set(data.map(x=>String(x[key])))].sort((a,b)=>{const order=filterOrders[key];if(!order)return a.localeCompare(b,"ko");const ai=order.indexOf(a),bi=order.indexOf(b);return (ai<0?999:ai)-(bi<0?999:bi)||a.localeCompare(b,"ko")});const section=document.createElement("section");section.className="filtergroup";section.innerHTML='<h2>'+label+' <span class="small">(복수선택)</span></h2><div class="checks">'+values.map(v=>{const count=data.filter(r=>String(r[key])===v).length;return '<label><input type="checkbox" data-key="'+key+'" value="'+esc(v)+'"><span class="optiontext">'+esc(v)+'</span><span class="count">('+count+')</span></label>'}).join("")+'</div>';filters.appendChild(section);if(key==="gre")addScoreFilter()}
function selected(key){return new Set([...document.querySelectorAll('input[type="checkbox"][data-key="'+key+'"]:checked')].map(x=>x.value))}
function enteredScores(){return Object.fromEntries([...document.querySelectorAll(".scoreinput")].map(input=>{const value=input.value.trim()===""?null:Number(input.value);return [input.dataset.score,Number.isFinite(value)?value:null]}))}
function meetsRequirement(requirement,scores){return Object.entries(requirement).every(([key,minimum])=>scores[key]===null||scores[key]>=minimum)}
function passesToefl(row,scores){if(!Object.values(scores).some(value=>value!==null)||!row.toeflReq.length)return true;return row.toeflReq.some(requirement=>meetsRequirement(requirement,scores))}
function render(){const query=q.value.toLowerCase(),scores=enteredScores();const sets=Object.fromEntries(groups.map(([k])=>[k,selected(k)]));const toeflEligible=data.filter(r=>passesToefl(r,scores));const result=toeflEligible.filter(r=>(!query||JSON.stringify(r).toLowerCase().includes(query))&&groups.every(([k])=>sets[k].size===0||sets[k].has(String(r[k]))));const hasScores=Object.values(scores).some(value=>value!==null),excluded=data.length-toeflEligible.length;shown.textContent=(hasScores?'TOEFL 미달 '+excluded+'개 제외 · ':'')+'표시 '+result.length+' / '+data.length+'개';document.getElementById("toeflSummary").textContent=hasScores?'공개된 신척도 입학 최소에 미달한 '+excluded+'개교를 제외했습니다. 기준 미공개·권장점수·TA 기준만 있는 학교는 유지합니다.':'입력한 항목의 공식 입학 최소에 명백히 미달하는 학교만 제외합니다. 권장점수와 TA 기준은 제외 조건이 아닙니다.';body.innerHTML=result.map(r=>'<tr><td><span class="tag">'+esc(r.portalStatus)+'</span><br>'+link(r.portalLink,"지원 링크")+'<br><span class="small">'+esc(r.portalNote)+'</span></td><td><b>#'+r.n+'</b><br>'+esc(r.usn2026??"미확인")+'</td><td><b>'+esc(r.u)+'</b><br><span class="tag">'+esc(r.programFit)+'</span><br>'+esc(r.p)+'<br><span class="small">'+esc(r.programFitNote)+' · '+esc(r.structure)+'</span></td><td><b>'+esc(r.deadline)+'</b><br><span class="small">'+esc(r.dstatus)+'</span></td><td><span class="tag '+cls(r.gre)+'">'+esc(r.gre)+'</span> <span class="small">'+esc(r.greGrade)+'</span><br><b>'+esc(r.greCycle)+'</b><br>'+esc(r.greEvidence)+'<br><span class="small">미제출: '+esc(r.impact)+'</span><br>'+link(r.greUrl,"학과 GRE")+'</td><td><b>신척도 '+esc(r.toeflNew)+'</b><br>구척도 '+esc(r.toeflOld)+'<br><span class="small">'+esc(r.englishNote)+'</span><br>'+link(r.englishUrl,"TOEFL 기준")+'</td><td>'+esc(r.focus)+'<br><span class="small">'+esc(r.orient)+'</span></td><td>'+esc(r.taEnglish)+'<br><span class="small">'+esc(r.ta)+'</span></td><td>'+esc(r.funding)+'<br><span class="tag">'+esc(r.flevel)+'</span></td><td>'+link(r.greUrl,"학과 GRE")+' · '+link(r.gradGreUrl,"대학원 GRE")+' · '+link(r.englishUrl,"TOEFL")+' · '+link(r.admissions,"입학")+' · '+link(r.finance,"펀딩")+' · '+link(r.research,"연구")+'</td></tr>').join("")}
for(const e of document.querySelectorAll('#q,input[type="checkbox"],.scoreinput'))e.addEventListener("input",render);reset.addEventListener("click",()=>{q.value="";for(const c of document.querySelectorAll('input[type="checkbox"]'))c.checked=false;for(const input of document.querySelectorAll(".scoreinput"))input.value="";render()});render();
const accessHash="bbd6d06c26e915c4d4fc9b550a93f2dafbd557fff0441e9ec320ff46c05ddef8",accessKey="phd-prep-access-v1";
const lockScreen=document.getElementById("lockScreen"),protectedContent=document.getElementById("protectedContent"),lockForm=document.getElementById("lockForm"),accessPassword=document.getElementById("accessPassword"),unlockButton=document.getElementById("unlockButton"),lockError=document.getElementById("lockError");
function unlockPage(){lockScreen.hidden=true;protectedContent.hidden=false;document.body.classList.remove("locked")}
function hasSessionAccess(){try{return sessionStorage.getItem(accessKey)==="granted"}catch{return false}}
function rememberSessionAccess(){try{sessionStorage.setItem(accessKey,"granted")}catch{}}
async function sha256(value){const bytes=new TextEncoder().encode(value),digest=await crypto.subtle.digest("SHA-256",bytes);return [...new Uint8Array(digest)].map(byte=>byte.toString(16).padStart(2,"0")).join("")}
lockForm.addEventListener("submit",async event=>{event.preventDefault();lockError.textContent="";unlockButton.disabled=true;unlockButton.textContent="확인 중";try{if(await sha256(accessPassword.value)===accessHash){rememberSessionAccess();accessPassword.value="";unlockPage()}else{lockError.textContent="비밀번호가 올바르지 않습니다.";accessPassword.select()}}catch{lockError.textContent="이 브라우저에서 비밀번호를 확인할 수 없습니다."}finally{unlockButton.disabled=false;unlockButton.textContent="열기"}});
if(hasSessionAccess())unlockPage();else accessPassword.focus();
</script>
</body>
</html>
